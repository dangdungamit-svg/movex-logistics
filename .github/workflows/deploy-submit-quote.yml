name: Deploy submit-quote Edge Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/submit-quote/**"
      - ".github/workflows/deploy-submit-quote.yml"

permissions:
  contents: read

concurrency:
  group: deploy-submit-quote
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: engxpijppqnlzlxxztjc
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy submit-quote
        run: supabase functions deploy submit-quote --project-ref "$SUPABASE_PROJECT_ID"
