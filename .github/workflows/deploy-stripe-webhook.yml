name: Deploy stripe-webhook Edge Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/stripe-webhook/**"
      - ".github/workflows/deploy-stripe-webhook.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stripe-webhook
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: engxpijppqnlzlxxztjc
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Stripe calls this endpoint without a Supabase JWT; the function verifies the Stripe signature itself.
      - name: Deploy stripe-webhook
        run: supabase functions deploy stripe-webhook --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
