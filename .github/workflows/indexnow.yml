name: Notify search engines (IndexNow)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait for Cloudflare Pages deployment
        run: sleep 240

      - name: Submit sitemap URLs to IndexNow (Bing, Yandex and partners)
        env:
          INDEXNOW_KEY: 82827623e2144de731d4e32385c0a70c
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' public/sitemap.xml | sed -e 's/<loc>//' -e 's/<\/loc>//' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          body=$(python3 -c 'import json,os,sys;print(json.dumps({"host":"movexlogistics.fi","key":os.environ["INDEXNOW_KEY"],"keyLocation":"https://movexlogistics.fi/"+os.environ["INDEXNOW_KEY"]+".txt","urlList":json.loads(sys.argv[1])}))' "$urls")
          code=$(curl -s -o /tmp/resp.txt -w '%{http_code}' -X POST 'https://api.indexnow.org/indexnow' -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow response: $code"; cat /tmp/resp.txt || true
          case "$code" in 200|202) exit 0;; *) exit 1;; esac
